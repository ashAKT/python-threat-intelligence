name: IOC Search

on:
  workflow_dispatch:
    inputs:
      ioc:
        description: "IP address, domain, URL, or file hash to search"
        required: true
        type: string

permissions:
  contents: read

jobs:
  search-ioc:
    name: Search threat intelligence database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository and Git LFS database
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: missp
        run: python -m pip install -r requirements.txt

      - name: Validate IOC database
        working-directory: missp
        run: |
          if [ ! -s threat_indicators.csv ]; then
            echo "::error::threat_indicators.csv is missing or empty. Check that the Git LFS database was downloaded."
            exit 1
          fi
          echo "IOC database is present."
          ls -lh threat_indicators.csv

      - name: Search IOC
        working-directory: missp
        env:
          IOC: ${{ inputs.ioc }}
        run: |
          if [ -z "${IOC//[[:space:]]/}" ]; then
            echo "::error::Please provide an IOC."
            exit 1
          fi
          python ioc_search.py --ioc "$IOC"

      - name: Upload matching records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioc-search-results
          path: missp/ioc_matches.csv
          if-no-files-found: warn
          retention-days: 7
