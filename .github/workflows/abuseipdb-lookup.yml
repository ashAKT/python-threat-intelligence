name: AbuseIPDB Lookup

on:
  workflow_dispatch:
    inputs:
      iocs:
        description: "Enter IPs, domains, URLs, or hashes separated by commas, spaces, or newlines (only IPs are queried)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  abuseipdb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Prepare input
        env:
          IOC_INPUT: ${{ inputs.iocs }}
        run: |
          python - <<'PY'
          import csv, os, re
          from pathlib import Path
          values = list(dict.fromkeys(x.strip().strip("\"'") for x in re.split(r"[,;\s]+", os.environ.get("IOC_INPUT", "")) if x.strip()))
          values = [x for x in values if not x.startswith("#")]
          if not values: raise SystemExit("No IOCs supplied.")
          p = Path("abuseipdb/actions_input.csv")
          with p.open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.DictWriter(f, fieldnames=["ioc"]); w.writeheader(); w.writerows({"ioc": x} for x in values)
          print(f"Prepared {len(values)} IOCs; AbuseIPDB queries IP addresses only.")
          PY
      - name: Run AbuseIPDB lookup
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: |
          if [ -z "$ABUSEIPDB_API_KEY" ]; then echo "::error::Add ABUSEIPDB_API_KEY under Settings > Secrets and variables > Actions."; exit 1; fi
          python abuseipdb/abuseipdb.py abuseipdb/actions_input.csv --output abuseipdb/abuseipdb_results.csv
      - name: Upload AbuseIPDB results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abuseipdb-lookup-results
          path: abuseipdb/abuseipdb_results.csv
          if-no-files-found: warn
          retention-days: 7
