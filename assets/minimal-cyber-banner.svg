<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Minimal dark cybersecurity banner</title>
<desc id="desc">A dim, cinematic laptop screen with glowing green digital rain on a nearly black teal background, inspired by a moody cybersecurity photograph.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071012"/><stop offset=".55" stop-color="#0b1516"/><stop offset="1" stop-color="#030809"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14201c"/><stop offset=".5" stop-color="#081310"/><stop offset="1" stop-color="#030807"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dff83" stop-opacity="0"/><stop offset=".5" stop-color="#a5ff75" stop-opacity=".85"/><stop offset="1" stop-color="#7dff83" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="screenClip"><path d="M96 65 L550 105 L626 277 L153 315 Z"/></clipPath>
  <pattern id="glyphs" width="19" height="25" patternUnits="userSpaceOnUse"><text x="3" y="12" font-family="monospace" font-size="10" fill="#8cff75">1</text><text x="9" y="23" font-family="monospace" font-size="9" fill="#c1ff91">0</text></pattern>
</defs>
