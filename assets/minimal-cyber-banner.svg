<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Minimal security status dashboard</title>
<desc id="desc">A moody close-up of a dark security interface with crisp green status checks on the left and softly blurred alert rows on the right, with subtle purple edge lighting.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11151d"/><stop offset=".55" stop-color="#171923"/><stop offset="1" stop-color="#080d17"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20242f" stop-opacity=".8"/><stop offset="1" stop-color="#0c1019" stop-opacity=".4"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7b4cff" stop-opacity="0"/><stop offset="1" stop-color="#7b4cff" stop-opacity=".8"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  <pattern id="texture" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 6.5H7" stroke="#fff" stroke-opacity=".025"/></pattern>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="360" fill="url(#glass)"/>
<!-- security checklist -->
<g transform="translate(72 30) rotate(-4 270 150)">
  <rect x="0" y="0" width="570" height="300" rx="4" fill="#11151e" stroke="#3a3c49" stroke-opacity=".65"/>
  <text x="46" y="52" fill="#e5e7ee" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">Security</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f0f0f4">
    <circle cx="36" cy="122" r="17" fill="#4e713d"/><path d="M27 122l7 7 13-16" fill="none" stroke="#f4f6ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="67" y="131">Networks are safe</text>
    <circle cx="36" cy="194" r="17" fill="#4e713d"/><path d="M27 194l7 7 13-16" fill="none" stroke="#f4f6ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="67" y="203">Virus free</text>
    <circle cx="36" cy="266" r="17" fill="#4e713d"/><path d="M27 266l7 7 13-16" fill="none" stroke="#f4f6ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="67" y="275">Apps are up-to-date</text>
  </g>
</g>
<!-- out-of-focus status and warning rows -->
<g filter="url(#soft)" opacity=".82" font-family="Arial, Helvetica, sans-serif">
  <rect x="680" y="64" width="460" height="30" rx="6" fill="#222632"/>
  <rect x="720" y="72" width="145" height="9" rx="4" fill="#8c929f"/>
  <rect x="970" y="72" width="120" height="9" rx="4" fill="#606a70"/>
  <path d="M690 125l17 30h-34z" fill="#f59b28"/><rect x="730" y="132" width="290" height="12" rx="5" fill="#8e929d"/><rect x="1040" y="132" width="95" height="12" rx="5" fill="#62775a"/>
  <path d="M735 197l17 30h-34z" fill="#f59b28"/><rect x="775" y="204" width="250" height="12" rx="5" fill="#9699a5"/><rect x="1050" y="204" width="90" height="12" rx="5" fill="#727783"/>
  <circle cx="875" cy="275" r="13" fill="#be3344"/><rect x="900" y="268" width="220" height="12" rx="5" fill="#a1a4ad"/>
  <rect x="675" y="315" width="480" height="5" rx="2" fill="#282e3a"/>
</g>
<path d="M0 344C230 330 440 355 680 343S1010 346 1200 325" fill="none" stroke="url(#purple)" stroke-width="4" opacity=".6"/>
<rect width="1200" height="360" fill="url(#texture)"/>
<rect width="1200" height="360" filter="url(#grain)" opacity=".6"/>
<rect x="1" y="1" width="1198" height="358" fill="none" stroke="#aeb3c2" stroke-opacity=".12"/>
</svg>