<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Neon hacker terminal with digital rain</title>
  <desc id="desc">A dark cyberpunk terminal scene with animated green code rain, neon scanlines, a glowing access panel, and a digital grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020609"/><stop offset="55%" stop-color="#061725"/><stop offset="100%" stop-color="#10051f"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00f5ff"/><stop offset="100%" stop-color="#ff2bd6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="3" height="6" patternUnits="userSpaceOnUse"><path d="M0 5.5H3" stroke="#d8fff3" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)" stroke="#174b5b" stroke-width="2"/>
  <g opacity=".48" fill="#00ff88" font-family="monospace" font-size="14">
    <text x="700" y="-20">01010110<tspan x="700" dy="20">0xA31F</tspan><tspan x="700" dy="20">10110010</tspan><tspan x="700" dy="20">ACCESS</tspan><tspan x="700" dy="20">01101001</tspan><tspan x="700" dy="20">ROOT?</tspan><animateTransform attributeName="transform" type="translate" from="0 -100" to="0 410" dur="8s" repeatCount="indefinite"/></text>
    <text x="780" y="-120">10110101<tspan x="780" dy="20">01001010</tspan><tspan x="780" dy="20">NODE_07</tspan><tspan x="780" dy="20">11001010</tspan><tspan x="780" dy="20">01101001</tspan><tspan x="780" dy="20">0xFF02</tspan><animateTransform attributeName="transform" type="translate" from="0 -80" to="0 500" dur="11s" repeatCount="indefinite"/></text>
    <text x="875" y="-60">11010001<tspan x="875" dy="20">01011010</tspan><tspan x="875" dy="20">TRACE_OFF</tspan><tspan x="875" dy="20">00110110</tspan><tspan x="875" dy="20">ENCRYPT</tspan><tspan x="875" dy="20">10101101</tspan><animateTransform attributeName="transform" type="translate" from="0 -140" to="0 470" dur="9s" repeatCount="indefinite"/></text>
    <text x="1110" y="-150">01011011<tspan x="1110" dy="20">10101010</tspan><tspan x="1110" dy="20">0xC0DE</tspan><tspan x="1110" dy="20">01010101</tspan><tspan x="1110" dy="20">SIGNAL</tspan><animateTransform attributeName="transform" type="translate" from="0 -100" to="0 490" dur="7s" repeatCount="indefinite"/></text>
  </g>
  <g stroke="#00f5ff" stroke-opacity=".3" fill="none">
    <path d="M620 45H1140M620 80H1140M620 115H1140M620 150H1140M620 185H1140M620 220H1140M620 255H1140M620 290H1140"/>
    <path d="M650 20V320M740 20V320M830 20V320M920 20V320M1010 20V320M1100 20V320"/>
  </g>
  <g>
    <rect x="50" y="42" width="530" height="274" rx="10" fill="#050d17" stroke="url(#neon)" stroke-width="1.5"/>
    <path d="M50 78H580" stroke="#1c5362"/>
    <circle cx="72" cy="60" r="5" fill="#ff4d9d"/><circle cx="90" cy="60" r="5" fill="#ffd166"/><circle cx="108" cy="60" r="5" fill="#00ff88"/>
    <text x="132" y="65" font-family="monospace" font-size="12" fill="#8ba8bb">root@cyberspace:~</text>
    <g font-family="monospace" font-size="15">
      <text x="74" y="112" fill="#00ff88">$ initializing secure shell...<animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/></text>
      <text x="74" y="146" fill="#00f5ff">[ OK ] encrypted tunnel established</text>
      <text x="74" y="180" fill="#00ff88">[ OK ] firewall rules loaded</text>
      <text x="74" y="214" fill="#ff4de1">[ ! ] unauthorized access denied</text>
      <text x="74" y="248" fill="#00f5ff">ACCESS GRANTED<span fill="#00ff88"> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></span></text>
    </g>
    <path d="M74 272H340" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  </g>
  <g fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
    <path d="M630 310L680 270L730 310L780 270L830 310L880 270L930 310L980 270L1030 310L1080 270L1130 310"/>
  </g>
  <rect width="1200" height="360" rx="18" fill="url(#scan)"/>
  <text x="635" y="337" font-family="monospace" font-size="12" letter-spacing="3" fill="#9cfde9">DIGITAL SHADOWS // SIGNAL NEVER SLEEPS</text>
</svg>