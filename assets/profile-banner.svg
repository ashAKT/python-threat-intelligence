<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Dark code editor themed profile banner</title>
  <desc id="desc">A clean dark code editor window with syntax-highlighted code, a file tree, and a terminal panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0f17"/><stop offset="100%" stop-color="#101b2b"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bg)" stroke="#26394d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="42" rx="15" fill="#151e2b"/><path d="M1 28V43H1199V28" fill="#151e2b"/>
  <circle cx="24" cy="21" r="5" fill="#ff6b6b"/><circle cx="43" cy="21" r="5" fill="#ffd166"/><circle cx="62" cy="21" r="5" fill="#06d6a0"/>
  <text x="600" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#91a4ba">profile.md — code editor</text>
  <rect x="1" y="44" width="225" height="295" fill="#0d1520"/><path d="M226 44V339" stroke="#26394d"/>
  <text x="22" y="73" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#72869d">EXPLORER</text>
  <text x="22" y="108" font-family="monospace" font-size="14" fill="#8da5c0">▾  WORKSPACE</text>
  <text x="43" y="139" font-family="monospace" font-size="14" fill="#65e6c4">▣  profile.md</text>
  <text x="43" y="169" font-family="monospace" font-size="14" fill="#8da5c0">▣  config.json</text>
  <text x="43" y="199" font-family="monospace" font-size="14" fill="#8da5c0">▣  terminal.sh</text>
  <text x="43" y="229" font-family="monospace" font-size="14" fill="#8da5c0">▣  README.md</text>
  <rect x="227" y="44" width="972" height="37" fill="#101a27"/><text x="250" y="68" font-family="monospace" font-size="13" fill="#65e6c4">● profile.md</text>
  <g font-family="monospace" font-size="16">
    <g fill="#52657a" text-anchor="end"><text x="260" y="116">1</text><text x="260" y="146">2</text><text x="260" y="176">3</text><text x="260" y="206">4</text><text x="260" y="236">5</text><text x="260" y="266">6</text></g>
    <text x="285" y="116" fill="#c792ea">const</text><text x="340" y="116" fill="#82aaff">profile</text><text x="405" y="116" fill="#d6deeb">= {</text>
    <text x="310" y="146" fill="#c3e88d">theme</text><text x="367" y="146" fill="#d6deeb">:</text><text x="385" y="146" fill="#ecc48d">'dark-editor'</text><text x="515" y="146" fill="#d6deeb">,</text>
    <text x="310" y="176" fill="#c3e88d">mode</text><text x="367" y="176" fill="#d6deeb">:</text><text x="385" y="176" fill="#ecc48d">'creative'</text><text x="492" y="176" fill="#d6deeb">,</text>
    <text x="310" y="206" fill="#c3e88d">status</text><text x="380" y="206" fill="#d6deeb">:</text><text x="398" y="206" fill="#ecc48d">'online'</text><text x="482" y="206" fill="#d6deeb">,</text>
    <text x="310" y="236" fill="#c3e88d">access</text><text x="380" y="236" fill="#d6deeb">:</text><text x="398" y="236" fill="#ecc48d">'granted'</text>
    <text x="285" y="266" fill="#d6deeb">};</text>
  </g>
  <rect x="227" y="308" width="972" height="31" fill="#0b121c"/>
  <text x="248" y="328" font-family="monospace" font-size="12" fill="#65e6c4">TERMINAL</text><text x="340" y="328" font-family="monospace" font-size="12" fill="#8da5c0">user@github</text><text x="435" y="328" font-family="monospace" font-size="12" fill="#64a9ff">~ $</text><rect x="458" y="316" width="7" height="14" fill="#65e6c4"/>
</svg>