    <text x="760" y="-150">10110010<tspan x="760" dy="19">ACCESS</tspan><tspan x="760" dy="19">00101101</tspan><tspan x="760" dy="19">0xFF02</tspan><tspan x="760" dy="19">TRACE_OFF</tspan><animateTransform attributeName="transform" type="translate" from="0 -80" to="0 500" dur="11s" repeatCount="indefinite"/></text>
    <text x="1125" y="-90">11010001<tspan x="1125" dy="19">01011010</tspan><tspan x="1125" dy="19">ENCRYPT</tspan><tspan x="1125" dy="19">10101101</tspan><animateTransform attributeName="transform" type="translate" from="0 -70" to="0 470" dur="9s" repeatCount="indefinite"/></text>
