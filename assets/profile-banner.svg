<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic neon hacker city banner</title>
  <desc id="desc">A mysterious hooded silhouette overlooking a futuristic neon city, with animated digital rain, glowing circuitry, and a cyberpunk skyline. No code editor window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#03040d"/><stop offset="48%" stop-color="#10051f"/><stop offset="100%" stop-color="#031522"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff9d"/><stop offset="50%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#ff2bd6"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#15253a"/><stop offset="100%" stop-color="#03050d"/></linearGradient>
    <radialGradient id="aura"><stop offset="0%" stop-color="#ff2bd6" stop-opacity=".38"/><stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="3" height="6" patternUnits="userSpaceOnUse"><path d="M0 5.5H3" stroke="#b8fff4" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
