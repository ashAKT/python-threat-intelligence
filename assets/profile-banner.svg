<g text-anchor="middle" font-family="monospace"><text x="600" y="166" fill="#00f5d4" font-size="15" letter-spacing="8">[ CONNECTION ESTABLISHED ]</text><text x="600" y="226" fill="#f5f7ff" font-size="52" font-weight="700" letter-spacing="5" filter="url(#glow)">NEON SIGNAL</text><text x="600" y="263" fill="#ff4ecd" font-size="19" letter-spacing="7">ACCESS THE UNKNOWN_</text><text x="600" y="350" fill="#9fb2ca" font-size="12" letter-spacing="4">EXPLORE // EXPERIMENT // BUILD</text></g>
