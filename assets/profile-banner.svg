<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">NEON SIGNAL // Cyberpunk profile banner</title><desc id="desc">Animated neon skyline, digital rain, orbital rings and moving data pulses around a glowing title.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070510"/><stop offset=".52" stop-color="#12102c"/><stop offset="1" stop-color="#001d28"/></linearGradient><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5d4"/><stop offset=".52" stop-color="#8c5bff"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#00f5d4" stroke-opacity=".1"/></pattern></defs>
<rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
<g fill="#00f5d4" font-family="monospace" font-size="13" opacity=".45"><text x="34" y="42">01001000 01000001 01000011 01001011</text><text x="760" y="42">NODE: 0x7E // SECURE LINK</text><text x="60" y="95">01101001 00110101 10100110<animate attributeName="y" values="95;360;95" dur="9s" repeatCount="indefinite"/></text><text x="260" y="65">10101001 01001010<animate attributeName="y" values="65;340;65" dur="7s" repeatCount="indefinite"/></text><text x="680" y="100">11010010 00101101<animate attributeName="y" values="100;350;100" dur="8s" repeatCount="indefinite"/></text><text x="1080" y="80">01010101<animate attributeName="y" values="80;360;80" dur="10s" repeatCount="indefinite"/></text><text x="900" y="60">10111001 11001010<animate attributeName="y" values="60;330;60" dur="6.5s" repeatCount="indefinite"/></text></g>
