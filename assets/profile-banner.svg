<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">NIGHTSHIFT Cyber Operations</title><desc id="desc">Animated cyber operations dashboard with rotating radar, moving signal traces, digital grid, and neon indicators.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".52" stop-color="#10102a"/><stop offset="1" stop-color="#031b24"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a31" stop-opacity=".97"/><stop offset="1" stop-color="#07131d" stop-opacity=".92"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00f5d4" stop-opacity="0"/><stop offset="1" stop-color="#00f5d4" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4af5e8" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="380" rx="18" fill="url(#bg)"/><rect width="1200" height="380" fill="url(#grid)"/>
