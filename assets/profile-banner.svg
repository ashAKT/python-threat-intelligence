<g fill="#00f5d4" filter="url(#glow)"><circle cx="150" cy="292" r="4"/><circle cx="505" cy="218" r="4"/><circle cx="720" cy="78" r="4"/><circle cx="1070" cy="250" r="4"/></g>
<g transform="translate(925 190)"><circle r="122" fill="#04141e" fill-opacity=".7" stroke="#00f5d4" stroke-opacity=".65" stroke-width="1.5"/><circle r="92" fill="none" stroke="#00f5d4" stroke-opacity=".4"/><circle r="61" fill="none" stroke="#00f5d4" stroke-opacity=".4"/><circle r="30" fill="none" stroke="#00f5d4" stroke-opacity=".4"/><path d="M-122 0H122M0 -122V122M-86 -86L86 86M-86 86L86 -86" stroke="#00f5d4" stroke-opacity=".22"/><path d="M0 0L0 -119A119 119 0 0 1 91 -76Z" fill="url(#sweep)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></path><circle cx="42" cy="-47" r="4" fill="#ff4ecd" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="-61" cy="20" r="4" fill="#ffb454" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="15" cy="66" r="3" fill="#00f5d4"/></g>
<g transform="translate(62 48)"><rect width="610" height="284" rx="14" fill="url(#panel)" stroke="#00f5d4" stroke-opacity=".65"/><path d="M0 42H610" stroke="#00f5d4" stroke-opacity=".45"/><circle cx="22" cy="21" r="5" fill="#ff4ecd"/><circle cx="40" cy="21" r="5" fill="#ffb454"/><circle cx="58" cy="21" r="5" fill="#00f5d4"/><text x="80" y="26" fill="#8ea6bd" font-family="monospace" font-size="12" letter-spacing="2">NIGHTSHIFT // LIVE TELEMETRY</text><text x="30" y="93" fill="#00f5d4" font-family="monospace" font-size="15" letter-spacing="4">SYSTEM INITIALIZED</text><text x="28" y="145" fill="#f3f7ff" font-family="monospace" font-size="42" font-weight="700">CYBER</text><text x="28" y="190" fill="#f3f7ff" font-family="monospace" font-size="42" font-weight="700">OPERATIONS<tspan fill="#ff4ecd">_</tspan></text><text x="31" y="224" fill="#a9bdd1" font-family="monospace" font-size="13">THREAT SIGNALS / OPEN SOURCE / AUTOMATION</text><rect x="30" y="248" width="12" height="12" rx="2" fill="#00f5d4"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></rect><text x="51" y="259" fill="#00f5d4" font-family="monospace" font-size="12" letter-spacing="2">SIGNAL LOCKED</text><text x="572" y="259" fill="#ff4ecd" font-family="monospace" font-size="12" text-anchor="end">[ 0x7E ]</text></g>
