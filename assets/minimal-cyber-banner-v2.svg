<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Minimal cybersecurity quote banner</title>
<desc id="desc">Dark, cinematic security-interface background with one centered quote in muted green and white.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10141c"/><stop offset=".55" stop-color="#171923"/><stop offset="1" stop-color="#080d13"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee787" stop-opacity="0"/><stop offset=".5" stop-color="#6ee787" stop-opacity=".65"/><stop offset="1" stop-color="#6ee787" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="lines" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H8" stroke="#fff" stroke-opacity=".025"/></pattern>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<g opacity=".25" filter="url(#blur)" fill="none" stroke="#657d6c">
  <rect x="70" y="40" width="400" height="260" rx="8" stroke-width="12"/>
  <path d="M100 100H420M100 150H380M100 200H400M720 80H1100M750 130H1080M760 180H1120M720 230H1050" stroke-width="10"/>
</g>
<rect width="1200" height="360" fill="url(#lines)"/>
<path d="M0 318H1200" stroke="url(#edge)" stroke-width="2"/>
<g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="160" fill="#E5E9E6" font-size="36" font-weight="600" letter-spacing=".3">THE BEST DEFENSE BEGINS</text>
  <text x="600" y="208" fill="#79DB87" font-size="36" font-weight="600" letter-spacing=".3">BEFORE THE ATTACK.</text>
</g>
<rect x="1" y="1" width="1198" height="358" fill="none" stroke="#aeb3c2" stroke-opacity=".12"/>
</svg>